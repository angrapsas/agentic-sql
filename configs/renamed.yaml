# Renamed-schema Chinook (chinook_v2_renamed): same data and questions, tables
# and columns renamed (Track -> Song, Composer -> Writer, ...). Tests whether a
# model reads the schema or recalls Chinook. Needs AGSQL_DB=data/Chinook_renamed.db;
# the harness refuses to run otherwise. Results go to $AGSQL_RESULTS/renamed.
#
# Tuned adapters here are trained on train_v1_renamed.jsonl, the same pairs
# rewritten with the same name map, so they know the new names the way the
# ladder adapters know the old ones.

dataset: chinook_v2_renamed

defaults:
  backend_args: {}
  setup_args: {}

arms:

  rn-haiku-oneshot:
    label: "haiku one-shot (renamed)"
    backend: anthropic
    setup: oneshot
    backend_args:
      model_id: claude-haiku-5-5

  rn-haiku-loop:
    label: "haiku loop (renamed)"
    backend: anthropic
    setup: loop
    backend_args:
      model_id: claude-haiku-5-5

  rn-sonnet-oneshot:
    label: "sonnet one-shot (renamed)"
    backend: anthropic
    setup: oneshot
    backend_args:
      model_id: claude-sonnet-5-5

  rn-2b-oneshot:
    label: "2b one-shot untuned (renamed)"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B

  rn-2b-loop:
    label: "2b loop untuned (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B

  rn-2b-loop-tuned-s0:
    label: "2b loop tuned s0 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B
      adapter: ${AGSQL_ADAPTERS}/renamed_2b_s0

  rn-2b-loop-tuned-s1:
    label: "2b loop tuned s1 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B
      adapter: ${AGSQL_ADAPTERS}/renamed_2b_s1

  rn-2b-loop-tuned-s2:
    label: "2b loop tuned s2 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B
      adapter: ${AGSQL_ADAPTERS}/renamed_2b_s2

  rn-4b-oneshot:
    label: "4b one-shot untuned (renamed)"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B

  rn-4b-loop:
    label: "4b loop untuned (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B

  rn-4b-loop-tuned-s0:
    label: "4b loop tuned s0 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/renamed_4b_s0

  rn-4b-loop-tuned-s1:
    label: "4b loop tuned s1 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/renamed_4b_s1

  rn-4b-loop-tuned-s2:
    label: "4b loop tuned s2 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/renamed_4b_s2

  rn-9b-oneshot:
    label: "9b one-shot untuned (renamed)"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B

  rn-9b-loop:
    label: "9b loop untuned (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B

  rn-9b-loop-tuned-s0:
    label: "9b loop tuned s0 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/renamed_9b_s0

  rn-9b-loop-tuned-s1:
    label: "9b loop tuned s1 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/renamed_9b_s1

  rn-9b-loop-tuned-s2:
    label: "9b loop tuned s2 (renamed)"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/renamed_9b_s2

  # ---- one-shot with the full schema (tables and columns): memory of the
  # schema gives no advantage here. Untuned only: adapters were trained on the
  # table-names-only prompt, so a tuned arm here would mix in a prompt change.

  rn-2b-schema:
    label: "2b one-shot full schema (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B

  rn-4b-schema:
    label: "4b one-shot full schema (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B

  rn-9b-schema:
    label: "9b one-shot full schema (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B

  rn-haiku-schema:
    label: "haiku one-shot full schema (renamed)"
    backend: anthropic
    setup: oneshot_schema
    backend_args:
      model_id: claude-haiku-5-5

  rn-sonnet-schema:
    label: "sonnet one-shot full schema (renamed)"
    backend: anthropic
    setup: oneshot_schema
    backend_args:
      model_id: claude-sonnet-5-5

  # ---- full-schema one-shot, TUNED: adapters trained on the same full-schema
  # prompt they are evaluated with (train_adapter.py --prompt schema).

  rn-4b-schema-tuned-s0:
    label: "4b full schema tuned s0 (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/renamed_schema_4b_s0

  rn-4b-schema-tuned-s1:
    label: "4b full schema tuned s1 (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/renamed_schema_4b_s1

  rn-4b-schema-tuned-s2:
    label: "4b full schema tuned s2 (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/renamed_schema_4b_s2

  rn-9b-schema-tuned-s0:
    label: "9b full schema tuned s0 (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/renamed_schema_9b_s0

  rn-9b-schema-tuned-s1:
    label: "9b full schema tuned s1 (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/renamed_schema_9b_s1

  rn-9b-schema-tuned-s2:
    label: "9b full schema tuned s2 (renamed)"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/renamed_schema_9b_s2
