# Size ladder on chinook_v2 (DRAFT). Results go to $AGSQL_RESULTS/ladder.
#
# Every Qwen3.5 size, bf16, same hand-written loop. Untuned once; tuned three
# times, each with an adapter trained on a different seed (and so a different
# 85/15 split of train_v1), because stage 1 showed retraining alone moves
# results by up to 4 questions. Report tuned as mean and range over seeds.
#
# Tuned adapters use train_v1 on purpose: when train_v2 exists, the same ladder
# rerun gives a clean before/after on training data diversity.
#
# Ordered small and fast first.

dataset: chinook_v2

defaults:
  backend_args: {}
  setup_args: {}

arms:

  v2-no-model:
    label: "templates"
    backend: none
    setup: templates

  v2-0.8b-loop:
    label: "0.8b loop untuned"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-0.8B

  v2-0.8b-loop-tuned-s0:
    label: "0.8b loop tuned s0"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-0.8B
      adapter: ${AGSQL_ADAPTERS}/ladder_0.8b_s0

  v2-0.8b-loop-tuned-s1:
    label: "0.8b loop tuned s1"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-0.8B
      adapter: ${AGSQL_ADAPTERS}/ladder_0.8b_s1

  v2-0.8b-loop-tuned-s2:
    label: "0.8b loop tuned s2"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-0.8B
      adapter: ${AGSQL_ADAPTERS}/ladder_0.8b_s2

  v2-2b-loop:
    label: "2b loop untuned"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B

  v2-2b-loop-tuned-s0:
    label: "2b loop tuned s0"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B
      adapter: ${AGSQL_ADAPTERS}/ladder_2b_s0

  v2-2b-loop-tuned-s1:
    label: "2b loop tuned s1"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B
      adapter: ${AGSQL_ADAPTERS}/ladder_2b_s1

  v2-2b-loop-tuned-s2:
    label: "2b loop tuned s2"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B
      adapter: ${AGSQL_ADAPTERS}/ladder_2b_s2

  v2-4b-loop:
    label: "4b loop untuned"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B

  v2-4b-loop-tuned-s0:
    label: "4b loop tuned s0"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/ladder_4b_s0

  v2-4b-loop-tuned-s1:
    label: "4b loop tuned s1"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/ladder_4b_s1

  v2-4b-loop-tuned-s2:
    label: "4b loop tuned s2"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/ladder_4b_s2

  v2-9b-loop:
    label: "9b loop untuned"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B

  v2-9b-loop-tuned-s0:
    label: "9b loop tuned s0"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/ladder_9b_s0

  v2-9b-loop-tuned-s1:
    label: "9b loop tuned s1"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/ladder_9b_s1

  v2-9b-loop-tuned-s2:
    label: "9b loop tuned s2"
    backend: hf
    setup: loop
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/ladder_9b_s2

  # ---- no-loop baseline: same models, one shot, no tools ----

  v2-0.8b-oneshot:
    label: "0.8b one-shot untuned"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-0.8B

  v2-0.8b-oneshot-tuned-s0:
    label: "0.8b one-shot tuned s0"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-0.8B
      adapter: ${AGSQL_ADAPTERS}/ladder_0.8b_s0

  v2-2b-oneshot:
    label: "2b one-shot untuned"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B

  v2-2b-oneshot-tuned-s0:
    label: "2b one-shot tuned s0"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B
      adapter: ${AGSQL_ADAPTERS}/ladder_2b_s0

  v2-4b-oneshot:
    label: "4b one-shot untuned"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B

  v2-4b-oneshot-tuned-s0:
    label: "4b one-shot tuned s0"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
      adapter: ${AGSQL_ADAPTERS}/ladder_4b_s0

  v2-9b-oneshot:
    label: "9b one-shot untuned"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B

  v2-9b-oneshot-tuned-s0:
    label: "9b one-shot tuned s0"
    backend: hf
    setup: oneshot
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B
      adapter: ${AGSQL_ADAPTERS}/ladder_9b_s0

  # ---- frontier reference, run from a laptop (API, no GPU) ----
  # Same conditions as the small models: one-shot and the same loop. The exact
  # model string is recorded here so the paper can name it. Change it if you
  # want the Haiku version phase 4 used; v2 resets comparability anyway.

  v2-haiku-oneshot:
    label: "haiku one-shot"
    backend: anthropic
    setup: oneshot
    backend_args:
      model_id: claude-haiku-5-5

  v2-haiku-loop:
    label: "haiku loop"
    backend: anthropic
    setup: loop
    backend_args:
      model_id: claude-haiku-5-5

  v2-sonnet-oneshot:
    label: "sonnet one-shot (ceiling)"
    backend: anthropic
    setup: oneshot
    backend_args:
      model_id: claude-sonnet-5-5

  # ---- one-shot with the full schema (tables and columns): memory of the
  # schema gives no advantage here. Untuned only: adapters were trained on the
  # table-names-only prompt, so a tuned arm here would mix in a prompt change.

  v2-2b-schema:
    label: "2b one-shot full schema"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-2B

  v2-4b-schema:
    label: "4b one-shot full schema"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B

  v2-9b-schema:
    label: "9b one-shot full schema"
    backend: hf
    setup: oneshot_schema
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-9B

  v2-haiku-schema:
    label: "haiku one-shot full schema"
    backend: anthropic
    setup: oneshot_schema
    backend_args:
      model_id: claude-haiku-5-5

  v2-sonnet-schema:
    label: "sonnet one-shot full schema"
    backend: anthropic
    setup: oneshot_schema
    backend_args:
      model_id: claude-sonnet-5-5
