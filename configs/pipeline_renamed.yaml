# Component study, v1 (see docs/component_study.md). Dataset: chinook_v2_renamed.
# One stage at a time goes from hand-written code to a model, in the order
# c0 (all code) -> c1 router -> c2 + generator -> c3 + linker -> c4 + repair,
# plus g1, the generator alone. Model stages are prompted, untuned, in v1.
# Haiku arms run from a laptop; Qwen arms on the cluster.
# Needs AGSQL_DB=data/Chinook_renamed.db; the harness refuses otherwise.

dataset: chinook_v2_renamed

defaults:
  backend_args: {}
  setup_args: {}

arms:

  plr-c0:
    label: "pipeline all code (renamed)"
    backend: none
    setup: pipeline

  plr-haiku-c1:
    label: "haiku c1 router (renamed)"
    backend: anthropic
    setup: pipeline
    backend_args:
      model_id: claude-haiku-5-5
    setup_args:
      router: model
      linker: code
      generator: code
      repair: code

  plr-haiku-c2:
    label: "haiku c2 router+generator (renamed)"
    backend: anthropic
    setup: pipeline
    backend_args:
      model_id: claude-haiku-5-5
    setup_args:
      router: model
      linker: code
      generator: model
      repair: code

  plr-haiku-c3:
    label: "haiku c3 router+linker+generator (renamed)"
    backend: anthropic
    setup: pipeline
    backend_args:
      model_id: claude-haiku-5-5
    setup_args:
      router: model
      linker: model
      generator: model
      repair: code

  plr-haiku-c4:
    label: "haiku c4 all model (renamed)"
    backend: anthropic
    setup: pipeline
    backend_args:
      model_id: claude-haiku-5-5
    setup_args:
      router: model
      linker: model
      generator: model
      repair: model

  plr-haiku-g1:
    label: "haiku g1 generator only (renamed)"
    backend: anthropic
    setup: pipeline
    backend_args:
      model_id: claude-haiku-5-5
    setup_args:
      router: code
      linker: code
      generator: model
      repair: code

  plr-4b-c1:
    label: "4b c1 router (renamed)"
    backend: hf
    setup: pipeline
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
    setup_args:
      router: model
      linker: code
      generator: code
      repair: code

  plr-4b-c2:
    label: "4b c2 router+generator (renamed)"
    backend: hf
    setup: pipeline
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
    setup_args:
      router: model
      linker: code
      generator: model
      repair: code

  plr-4b-c3:
    label: "4b c3 router+linker+generator (renamed)"
    backend: hf
    setup: pipeline
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
    setup_args:
      router: model
      linker: model
      generator: model
      repair: code

  plr-4b-c4:
    label: "4b c4 all model (renamed)"
    backend: hf
    setup: pipeline
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
    setup_args:
      router: model
      linker: model
      generator: model
      repair: model

  plr-4b-g1:
    label: "4b g1 generator only (renamed)"
    backend: hf
    setup: pipeline
    thinking: false
    backend_args:
      model_id: Qwen/Qwen3.5-4B
